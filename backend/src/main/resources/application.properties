# Spring Boot Server Configuration
server.port=8080
server.servlet.context-path=/

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aives_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SpringDoc OpenAPI (Swagger UI) Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

aives.demo.enabled=${AIVES_DEMO_ENABLED:false}
aives.admin.email=${AIVES_ADMIN_EMAIL:}
aives.admin.password=${AIVES_ADMIN_PASSWORD:}
aives.admin.code=${AIVES_ADMIN_CODE:ADMIN01}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
