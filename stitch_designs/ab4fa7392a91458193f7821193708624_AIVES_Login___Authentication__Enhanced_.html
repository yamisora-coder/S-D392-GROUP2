<body class="bg-slate-100 text-slate-800 font-sans antialiased"><div class="min-h-screen flex items-center justify-center bg-slate-100 p-4"><div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden p-8"><div class="text-center mb-6 relative"><div class="absolute top-0 right-0 flex items-center space-x-1 border border-slate-200 rounded-lg p-1 bg-slate-50"><button class="text-xs px-2 py-0.5 rounded font-medium text-slate-700 bg-white shadow-sm" type="button">EN</button><button class="text-xs px-2 py-0.5 rounded font-medium text-slate-500 hover:text-slate-700" type="button">VN</button></div><div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-50 text-blue-600 mb-3"><i class="fa-solid fa-graduation-cap text-xl"></i></div><h1 class="text-2xl font-bold tracking-tight text-slate-900">AIVES Portal</h1><p class="text-xs text-slate-600 mt-1 font-medium">Secure AI Viva Exam &amp; Proctoring System</p></div><form class="space-y-4 mb-6"><div><label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email / Student ID</label><div class="relative"><span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-user text-xs"></i></span><input class="w-full pl-9 pr-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-600 bg-slate-50 text-slate-800 placeholder-slate-400 font-medium" placeholder="e.g. SV102938 or email@university.edu" type="text"/></div></div><div><div class="flex items-center justify-between mb-1"><label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label><a class="text-xs text-blue-600 hover:underline font-medium" href="#">Forgot Password?</a></div><div class="relative"><span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-lock text-xs"></i></span><input class="w-full pl-9 pr-10 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-600 bg-slate-50 text-slate-800 placeholder-slate-400 font-medium" placeholder="••••••••" type="password"/><button class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-600" type="button"><i class="fa-regular fa-eye text-xs"></i></button></div></div><div class="flex items-center text-xs"><label class="flex items-center text-slate-600 cursor-pointer"><input class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 mr-2 w-4 h-4" type="checkbox"/> Remember me</label></div><button class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition-all shadow-sm shadow-blue-200 flex items-center justify-center space-x-2" type="submit"><span>Sign In</span><i class="fa-solid fa-arrow-right text-xs"></i></button></form><div class="relative flex py-2 items-center mb-4"><div class="flex-grow border-t border-slate-200"></div><span class="flex-shrink mx-4 text-xs text-slate-400 font-semibold uppercase tracking-wider">Or sign in with SSO</span><div class="flex-grow border-t border-slate-200"></div></div><div class="space-y-2 mb-6"><button class="w-full py-2.5 px-4 border border-slate-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors flex items-center justify-center space-x-2"><i class="fa-solid fa-building-columns text-slate-600"></i><span>University Account (Office 365)</span></button><button class="w-full py-2.5 px-4 border border-slate-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors flex items-center justify-center space-x-2"><i class="fa-brands fa-google text-slate-600"></i><span>Google Workspace</span></button></div><div class="mt-6 pt-4 border-t border-slate-100 text-center space-y-3"><p class="text-xs text-slate-600">Don't have an account? <a class="text-blue-600 font-semibold hover:underline" href="#">Register an account now</a></p><div class="text-xs text-slate-500 space-x-2"><a class="hover:underline" href="#">Guest Equipment Check</a><span>•</span><a class="hover:underline" href="#">Technical Support</a></div></div></div></div>
